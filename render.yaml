services:
  - type: web
    name: cs4135-fomo-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE
        value: https://cs4135-fomo-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
